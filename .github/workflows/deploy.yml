# GitHub Pages is NOT the deploy target - Vercel is, and it builds straight from
# the repo with no workflow. This is kept as an on-demand alternative only:
# it runs from the Actions tab, never on push, so it cannot redden the history.
#
# Before the first manual run, enable Pages in Settings > Pages with "GitHub
# Actions" as the source, or the deploy job fails on principle.
name: Deploy to GitHub Pages (manual)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # puppeteer is a screenshot tool for local review only - no need to pull
      # a Chromium download into the deploy.
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      # Pages serves from /ChefPro/; Vercel and local builds stay at '/'.
      VITE_BASE: /ChefPro/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
